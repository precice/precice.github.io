{{- $siteTitle := site.Title -}}
{{- with site.Params.site_title }}{{ $siteTitle = . }}{{ end -}}

<meta name="viewport" content="width=device-width, initial-scale=1">
{{ with .Params.summary }}<meta name="description" content="{{ plainify . }}">{{ end }}
<title>{{ with .Title }}{{ . }} | {{ end }}{{ $siteTitle }}</title>
<link rel="shortcut icon" href="{{ "/images/favicon.ico" | relURL }}">
<link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">

<link rel="stylesheet" href="{{ "css/bootstrap.min.css" | relURL }}">

<script src="{{ "js/prince.es6.polyfill.min.js" | relURL }}"></script>
<script src="{{ "js/prince.mathjax.compat.js" | relURL }}"></script>
<script src="{{ "js/katex.min.js" | relURL }}"></script>
<script defer src="{{ "js/auto-render.min.js" | relURL }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    function processMathTextNodes(root) {
      if (!root) return;
      var tag = root.nodeName ? root.nodeName.toLowerCase() : "";
      if (tag === "script" || tag === "style" || tag === "textarea" || tag === "pre" || tag === "code") {
        return;
      }
      if (root.nodeType === 3) {
        if (root.nodeValue && root.nodeValue.indexOf("$$") !== -1) {
          var parent = root.parentNode;
          if (parent) {
            var parentText = (parent.textContent || parent.innerText || "").trim();
            var isOnlyMath = /^(\$\$|\\\[)[\s\S]+(\$\$|\\\])$/.test(parentText) && parentText.indexOf("$$", 2) === (parentText.length - 2);
            if (!isOnlyMath) {
              root.nodeValue = root.nodeValue.replace(/\$\$([\s\S]+?)\$\$/g, function(match, math) {
                return "\\(" + math + "\\)";
              });
            }
          }
        }
        return;
      }
      var child = root.firstChild;
      while (child) {
        processMathTextNodes(child);
        child = child.nextSibling;
      }
    }

    processMathTextNodes(document.body);

    renderMathInElement(document.body, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false},
        {left: "\\(", right: "\\)", display: false},
        {left: "\\[", right: "\\]", display: true}
      ],
      throwOnError: false
    });
  });
</script>

<!-- scripts for Prince functionality -->
<script>
  if (typeof Prince !== "undefined") {
    Prince.addScriptFunc("datestamp", function() {
      return "{{ now.Format "January 2, 2006" }}";
    });
    Prince.addScriptFunc("guideName", function() {
      return "{{ site.Params.print_title | default "preCICE" }} Documentation";
    });
    Prince.addScriptFunc("versionNumber", function() {
      return "{{ site.Params.precice_version }}";
    });
  }
</script>
