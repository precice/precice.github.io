[[mounts]]
source = "_data"
target = "data"

# Read the existing website content while excluding Jekyll's homepage, which
# Hugo would otherwise interpret as a leaf bundle at the content root.
[[mounts]]
source = "content"
target = "content"
files = ["! index.html"]

[[mounts]]
source = "faq.html"
target = "content/faq/_index.html"

[[mounts]]
source = "collections/_publications"
target = "content/publications"

[[mounts]]
source = "collections/_testimonials"
target = "content/testimonials"

# Reuse the existing site styles while the Hugo layouts are still minimal.
[[mounts]]
source = "css"
target = "static/css"

[[mounts]]
source = "js"
target = "static/js"

[[mounts]]
source = "assets"
target = "static/assets"

[[mounts]]
source = "images"
target = "static/images"

[[mounts]]
source = "fonts"
target = "static/fonts"

[[mounts]]
source = "webfonts"
target = "static/webfonts"

