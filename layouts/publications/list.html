{{ define "main" }}
<section class="post-content">
  <header class="post-header">
    <h1 class="post-title-main">{{ .Title }}</h1>
  </header>

  {{ .Content }}

  {{- $publications := sort .RegularPages "Params.year" "desc" -}}
  {{- range $publications }}
    <div class="mb-4">
      {{ partial "publication_panel.html" (dict "pub" . "wrapper" false) }}
    </div>
  {{- end }}
</section>
{{ end }}
