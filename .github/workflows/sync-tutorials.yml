name: Sync Tutorials

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-tutorials
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Run Sync Script
        run: |
          python3 tools/sync_tutorials.py \
            --module-toml config/_default/module.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            config/_default/module.toml
          commit-message: "Update tutorials module mounts"
          branch: auto-sync-tutorials
          title: "Automated: Sync new tutorials from precice/tutorials"
          body: |
            This PR automatically synchronizes the Hugo module mounts with the latest tutorials available in the `precice/tutorials` repository.

            Generated by `.github/workflows/sync-tutorials.yml` using `tools/sync_tutorials.py`.
          labels: "automated"
          delete-branch: true
